with open("index_estreno_22h.html", "r", encoding="utf-8") as f:
    html = f.read()

minijuegos_marker = '      <!-- MINIJUEGOS -->'
carttelera_marker = '      <!-- ESTRENOS DE CARTTELERA -->'
categorias_marker = '      <!-- CATEGORÍAS -->'
end_home_marker = '    </div>\n\n    <!-- VISTA DE JUEGO'

idx_mini = html.find(minijuegos_marker)
idx_cart = html.find(carttelera_marker)
idx_cat = html.find(categorias_marker)
idx_end = html.find(end_home_marker)

assert -1 not in (idx_mini, idx_cart, idx_cat, idx_end), "One or more section markers not found"
assert idx_mini < idx_cart < idx_cat < idx_end, "Unexpected marker order"

minijuegos_block = html[idx_mini:idx_cart]
carttelera_block = html[idx_cart:idx_cat]
categorias_block = html[idx_cat:idx_end]

new_html = (
    html[:idx_mini]
    + carttelera_block
    + minijuegos_block
    + categorias_block
    + html[idx_end:]
)

assert new_html.index(carttelera_marker) < new_html.index(minijuegos_marker) < new_html.index(categorias_marker)

with open("index_orden_invertido.html", "w", encoding="utf-8") as f:
    f.write(new_html)

print("index_orden_invertido.html generado correctamente")
